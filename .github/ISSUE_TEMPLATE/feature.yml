name: An idea
description: Something it should do, or do differently
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The situation, not the solution. "I want to know how much I spend on my car each year" is more useful than "add a car page".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: textarea
    id: now
    attributes:
      label: What you do today instead
