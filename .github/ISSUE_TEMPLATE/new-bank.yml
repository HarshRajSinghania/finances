name: Support a bank
description: A bank's statement PDF or export does not import correctly
labels: ["bank support"]
body:
  - type: markdown
    attributes:
      value: |
        **Never attach a real statement or export.** For a PDF, attach its scrambled layout instead:

        ```
        finances report-bank statement.pdf
        ```

        That writes `statement-layout.txt`: every line at its own position, with names, merchants, amounts and account numbers replaced by random ones. Dates and the statement's own headings are kept, because they are what the parser reads. It is plain text, so open it and read it before you attach it.
  - type: input
    id: bank
    attributes:
      label: Bank and account type
      placeholder: "e.g. Citi Double Cash card, ING current account (NL)"
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: File type
      options: [Statement PDF, CSV, OFX / QFX, CAMT.053, MT940, Other]
    validations:
      required: true
  - type: textarea
    id: layout
    attributes:
      label: The layout (for a PDF)
      description: Drag `statement-layout.txt` here, or paste it. Its header already says what the parser read.
  - type: textarea
    id: shape
    attributes:
      label: What the file looks like (for an export)
      description: The header row and one made-up row.
      render: text
  - type: textarea
    id: wrong
    attributes:
      label: What came out wrong
      description: Missing transactions, wrong signs, the wrong bank, a total that does not add up...
  - type: checkboxes
    id: help
    attributes:
      label: Helping
      options:
        - label: I would like to add this bank myself (CONTRIBUTING.md, "Add a bank")
