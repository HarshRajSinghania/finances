name: release

# Push a tag like v0.3.0 to publish that version to PyPI and cut a GitHub
# release whose notes are that version's section of CHANGELOG.md.
#
# One-time setup: on pypi.org, add a "pending publisher" for project
# `finances` with owner roshanlam, repository finances, workflow release.yml
# and environment pypi. No API token is stored anywhere.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: the tag matches pyproject
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          test "$want" = "$have" || { echo "tag $want != pyproject $have"; exit 1; }
      - run: uv sync --locked && uv run python -m unittest discover tests
      - run: npm ci && npm run build
        working-directory: web
      - run: cp -r web/dist finances/web_dist
      - run: uv build
      - run: unzip -l dist/*.whl | grep -q 'finances/web_dist/index.html'
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} /^## / && on {exit} on' \
            CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md
      - run: gh release create "$GITHUB_REF_NAME" dist/* --notes-file notes.md --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
