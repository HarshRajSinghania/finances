name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      # No statements in CI, so the golden-file parser tests skip; everything
      # else, including the demo store reconciling, runs.
      - run: uv run python -m unittest discover tests
      - run: uv run finances categorize eval
      - name: demo end to end
        run: |
          uv run finances demo
          uv run finances check --db demo.db --strict
          uv run finances wrapped --db demo.db
          uv run finances budget cancel --db demo.db
      - name: bank exports, and a beancount file bean-check accepts
        run: |
          uv run finances import tests/fixtures/exports --db exports.db
          uv run finances export beancount --db demo.db -o demo.beancount --balances
          uvx --from beancount bean-check demo.beancount

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose run --rm finances demo --db /tmp/demo.db

  # What `uvx finances` installs: a wheel with the dashboard inside it.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - run: npm ci && npm run build
        working-directory: web
      - run: cp -r web/dist finances/web_dist
      - run: uv build
      - name: the wheel carries the dashboard and runs
        run: |
          unzip -l dist/*.whl | grep -q 'finances/web_dist/index.html'
          cd "$(mktemp -d)"
          uvx --from "$GITHUB_WORKSPACE"/dist/*.whl finances demo
          uvx --from "$GITHUB_WORKSPACE"/dist/*.whl finances check --db demo.db --strict
