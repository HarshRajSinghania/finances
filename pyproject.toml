[project]
name = "finances"
version = "0.4.1"
description = "See where your money goes from your own bank statements and exports, checked against their printed totals. No bank login; nothing leaves your machine."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "roshanlam" }]
keywords = ["personal-finance", "bank-statements", "pdf", "reconciliation",
            "budgeting", "local-first", "privacy", "ofx", "beancount", "ledger"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Office/Business :: Financial",
]
# pdfplumber is the only genuine dependency, and only parse.py imports it.
# Everything downstream is standard library, so the analysis half of the
# toolchain runs anywhere Python does.
dependencies = [
    "pdfplumber>=0.11.10",
]

[project.urls]
Homepage = "https://github.com/roshanlam/finances"
Issues = "https://github.com/roshanlam/finances/issues"
Changelog = "https://github.com/roshanlam/finances/blob/main/CHANGELOG.md"

[project.scripts]
finances = "finances.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["finances", "finances.verify"]

# The built dashboard rides along in the wheel, so `uvx finances web` works
# without Node. The release workflow copies web/dist here before building.
[tool.setuptools.package-data]
finances = ["web_dist/**/*"]

[tool.uv]
package = true
