[project]
name = "finances"
version = "0.6.0"
description = "Personal finance and reconciliation from your own files: bank statement exports, Stripe payouts and ledgers. Every number is checked against its source, with evidence you can re-run. Ask questions with Claude, OpenAI or a local model. No bank login, no Plaid, runs on your machine."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "roshanlam" }]
keywords = ["personal-finance", "bank-statements", "budgeting", "budgeting-and-forecasting",
            "budgeting-tool", "local-first", "local-llm", "pdf-parser", "privacy",
            "privacy-first", "privacy-tools", "reconciliation", "self-hosted",
            "ofx", "beancount", "ledger", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Office/Business :: Financial",
]
# pdfplumber is the only genuine dependency, and only parse.py imports it.
# Everything downstream is standard library, so the analysis half of the
# toolchain runs anywhere Python does.
dependencies = [
    "pdfplumber>=0.11.10",
]

[project.urls]
Homepage = "https://github.com/roshanlam/finances"
Repository = "https://github.com/roshanlam/finances"
Documentation = "https://github.com/roshanlam/finances#readme"
Issues = "https://github.com/roshanlam/finances/issues"
Changelog = "https://github.com/roshanlam/finances/blob/main/CHANGELOG.md"

[project.scripts]
finances = "finances.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["finances", "finances.verify", "finances.banks"]

# The built dashboard rides along in the wheel, so `uvx finances web` works
# without Node. The release workflow copies web/dist here before building.
[tool.setuptools.package-data]
finances = ["web_dist/**/*"]
"finances.banks" = ["*.toml"]

[tool.uv]
package = true
