name = "Amex"
statements = 'american express|americanexpress\.com|amex'
notes = [
    "Long merchant names wrap onto the line above the date, leaving a date-and-amount row with no description; the line above is used.",
    "Posting dates carry a footnote asterisk (\"03/25/26*\").",
    "The start of the period is often printed nowhere but the filename (\"Amex-Apr_10_-_May_10_2026.pdf\").",
]

[guide]
url = "https://www.americanexpress.com/us/customer-service/faq.download-export-transactions-software.html"
