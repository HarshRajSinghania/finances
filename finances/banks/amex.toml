history = "about 2 years of transactions online; older archived statements can be requested"
bulk = "Partly: transactions can be exported for a range of billing periods at once; statement PDFs are one per month."
steps = [
    "Sign in at americanexpress.com",
    "Open Statements & Activity",
    "Pick a billing period or date range",
    "Use the download option and choose a file format",
]
exports = [
    "PDF",
    "CSV",
    "Excel",
    "QFX",
    "QBO",
]
